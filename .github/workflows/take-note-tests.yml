name: take-note-tests

# The take-note hook and lib are shared by every agent on the machine, so the
# bats suite runs on every change to the plugin. Paths-filtered: nothing else
# in the repo affects this result. Runs on pull_request AND on push to main so
# a merge can't land a combination no single PR tested.
on:
  pull_request:
    paths:
      - "plugins/take-note/**"
      - ".github/workflows/take-note-tests.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/take-note/**"
      - ".github/workflows/take-note-tests.yml"

permissions:
  contents: read

# On a push the PR number is empty; fall back to the ref so pushes don't all
# collapse into one self-cancelling group.
concurrency:
  group: take-note-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    runs-on: ubuntu-latest
    # Seconds of work, no network. A ceiling turns a hang into a failed check.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install bats
        run: sudo apt-get update && sudo apt-get install -y bats
      - name: Run the take-note suite
        working-directory: plugins/take-note
        run: bats hooks/tests
