name: decide-tests

# The decide ask-guard hook is shared by every Discord-facing agent, so the
# bats suite runs on every change to the plugin. Paths-filtered: nothing else
# in the repo affects this result. Runs on pull_request AND on push to main so
# a merge can't land a combination no single PR tested.
on:
  pull_request:
    paths:
      - "plugins/decide/**"
      - ".github/workflows/decide-tests.yml"
  push:
    branches:
      - main
    paths:
      - "plugins/decide/**"
      - ".github/workflows/decide-tests.yml"

permissions:
  contents: read

# On a push the PR number is empty; fall back to the ref so pushes don't all
# collapse into one self-cancelling group.
concurrency:
  group: decide-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  bats:
    # The macOS leg is the portability gate: stock macOS ships bash 3.2, and the
    # suite runs the hook via /bin/bash. Both runner images ship python3.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    # Seconds of work, no network. A ceiling turns a hang into a failed check.
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Install bats and jq (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Install bats and jq (macOS)
        if: runner.os == 'macOS'
        run: brew install bats-core jq
      - name: Record the toolchain under test
        run: |
          /bin/bash --version | head -1
          bats --version
          jq --version
          python3 --version
      - name: Run the decide suite
        working-directory: plugins/decide
        run: bats hooks/tests
