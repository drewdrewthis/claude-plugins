name: pr-title

# The repo squashes with squash_merge_commit_title=PR_TITLE, so THIS TITLE
# becomes the commit subject on main — and that subject is the only thing
# release-please parses to decide the next version. A non-conventional title
# therefore ships nothing to installed boxes, silently.
#
# `pull_request`, deliberately NOT `pull_request_target`: the latter loads the
# workflow from the BASE branch, so a change to this guard could never be tested
# by its own PR. This way the guard grades itself before it lands.
#
# `edited` is load-bearing — without it a title fixed after a red check never
# re-runs, and the stale failure blocks the PR forever.
on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # Kept identical to release-please-config.json's changelog-sections,
          # plus the types that legitimately release nothing
          # (chore is hidden; ci, build, revert are unlisted). If these two lists
          # disagree, a title can pass here and still produce no release.
          types: |
            feat
            fix
            perf
            refactor
            docs
            test
            chore
            ci
            build
            revert
          requireScope: false
          # release-please reads the squashed SUBJECT; a body-only
          # "BREAKING CHANGE:" footer from a branch commit is discarded by the
          # squash, so `!` in the title is the only reliable major-bump signal.
          validateSingleCommit: false

  # `lint` only checks the title is well-formed. A well-formed `chore:` title
  # that touches plugins/<name>/ still releases nothing, so installed boxes
  # never see the change. Lives here (not a new workflow) to inherit `edited`.
  # Script tests: release-title-tests.yml.
  release-title:
    # release-please PRs are opened by github-actions[bot] and touch plugin
    # files by design. Matching the author stops a branch name alone from
    # skipping the check.
    if: ${{ !(startsWith(github.head_ref, 'release-please--') && github.event.pull_request.user.login == 'github-actions[bot]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check title releases every changed plugin
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Via env, never interpolated into the script: titles are attacker-controlled.
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          # A failed fetch must fail the step, not pass with an empty list.
          # previous_filename catches files moved out of a plugin.
          files="$RUNNER_TEMP/changed-files"
          gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files" \
            --jq '.[] | .filename, (.previous_filename // empty)' > "$files"
          .github/scripts/check-release-title.sh release-please-config.json < "$files"
