name: release-please

# Every installed plugin is cached per version at
# plugins/cache/<owner>/<plugin>/<version>/, so a change that does not bump the
# plugin's version never reaches an already-installed box. Bumping by hand is
# what failed (see the 0.2.1 gate-fork pin) — this makes the bump automatic.
on:
  push:
    branches: [main]
  # Re-run by hand when GitHub drops a push event: gh workflow run release-please.yml
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# The group makes release runs go one at a time. It does not stop a merge to
# main during a run; the repair step below fixes that case.
# https://github.com/drewdrewthis/claude-plugins/issues/232
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      # GitHub's GraphQL API sometimes answers "Something went wrong while executing
      # your query"; release-please retries only 502s, so one such answer fails the run.
      # A rerun is safe (it updates its own PRs), so try up to 3 times.
      - id: rp1
        uses: googleapis/release-please-action@v4
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.rp1.outcome == 'failure'
        run: sleep 30
      - id: rp2
        if: steps.rp1.outcome == 'failure'
        uses: googleapis/release-please-action@v4
        continue-on-error: true
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      - if: steps.rp2.outcome == 'failure'
        run: sleep 60
      - if: steps.rp2.outcome == 'failure'
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
      # The script and config come from the pushed commit, while release-please reads
      # the head of main: a plugin added by a later push can give one red run that the next run clears.
      - name: Check out the repair script
        uses: actions/checkout@v4
        if: ${{ !cancelled() }}
        with:
          persist-credentials: false

      # A merge to main during the run above can make release-please write a
      # manifest that sets another plugin's version back. Restore those lines.
      # Runs even when the action failed, because that run may have written a PR.
      - name: Repair release manifests
        if: ${{ !cancelled() }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: .github/scripts/repair-release-manifests.sh release-please-config.json .release-please-manifest.json
